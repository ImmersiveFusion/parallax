# Parallax against tools/gatetarget, for checking trace propagation end to end.
#   go run ./tools/gatetarget -endpoint <otlp:4317> -headers api-key=...
#   go run ./cmd/parallax -manifest examples/gate-target.yaml -once -endpoint <otlp:4317> -headers api-key=...
# Run gatetarget with -http 127.0.0.2:18080 -grpc 127.0.0.2:19090.
# Each node gets its own loopback address, because absence detection keys on
# the called host: gate-target is 127.0.0.2, gate-dead is 127.0.0.3, where
# nothing listens, so its probes are never answered.
apiVersion: parallax/v1
kind: Manifest
metadata:
  name: gate
graph:
  nodes:
    - name: gate-target
      owned: true
      instrumented: true
      http:
        baseURL: http://127.0.0.2:18080
        routes:
          - {method: GET, path: /healthz}
      grpc:
        target: 127.0.0.2:19090
        insecure: true
        health: true
    - name: gate-dead
      owned: true
      instrumented: false
      http:
        baseURL: http://127.0.0.3:18081
        routes:
          - {method: GET, path: /healthz}
run:
  interval: 15s
  timeout: 3s
